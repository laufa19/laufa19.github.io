<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🐾 Lola FAYET</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<script
src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

body{
  background-image:url("fond.jpg");
  background-size:cover;
  background-position:center;
  background-repeat:no-repeat;
  background-attachment:fixed;

  font-family:Arial, sans-serif;
  color:#fff;
  text-align:center;
  margin:0;
  padding:30px;

  min-height:100vh;
}

/* carte centrale */

.card{
  max-width:420px;
  margin:auto;
  padding:25px;

  background:rgba(0,0,0,0.35);
  backdrop-filter:blur(6px);

  border-radius:20px;

  box-shadow:0 10px 40px rgba(0,0,0,0.7);
}

/* photo chat */

img{
  width:100%;
  max-width:260px;
  margin-bottom:10px;
  background:transparent;
}

/* titre */

h1{
  margin:10px 0;
  text-shadow:0 2px 8px rgba(0,0,0,0.9);
}

/* boutons */

.button{
  display:block;
  width:100%;
  padding:16px;
  margin:12px 0;

  border-radius:12px;
  font-size:19px;
  font-weight:bold;

  text-decoration:none;
  color:white;

  border:none;
  box-sizing:border-box;
  cursor:pointer;
}

.call{background:#e84141;}
.sms{background:#00a884;}
.loc{background:#2e86ff;}
.map{background:#7a5cff;}

/* carte */

#map{
  height:320px;
  width:100%;
  margin-top:15px;
  border-radius:15px;
}

/* infos */

.info{
  margin-top:16px;
  font-size:17px;
  color:#eee;
}

a{
  color:#a8c6ff;
}

</style>

</head>

<body>

<div class="card">

<img src="lola.png" alt="Lola">

<h1>🐾 Lola FAYET</h1>

<a class="button call" href="tel:+33672714336">
📞 Appeler ma famille
</a>

<a class="button sms" href="sms:+33672714336">
💬 Envoyer un SMS
</a>

<button class="button loc" onclick="sendLocation()">
📍 Envoyer ma position
</button>

<button class="button map" onclick="showMap()">
🗺 Voir la carte
</button>

<div id="map"></div>

<div class="info">
6 route du Sagard<br>
19200 Ussel
</div>

<div class="info">
✉️
<a href="mailto:laurent.fayet.email@gmail.com">
laurent.fayet.email@gmail.com
</a>
</div>

<div class="info">
<strong>Tatouage :</strong> 177XZV
</div>

</div>

<script>

/* coordonnées maison */

const homeLat = 45.536151;
const homeLon = 2.298581;

let mapInstance = null;

/* distance */

function distance(lat1, lon1, lat2, lon2){

const R = 6371000;

const φ1 = lat1*Math.PI/180;
const φ2 = lat2*Math.PI/180;

const Δφ = (lat2-lat1)*Math.PI/180;
const Δλ = (lon2-lon1)*Math.PI/180;

const a =
Math.sin(Δφ/2)*Math.sin(Δφ/2)+
Math.cos(φ1)*Math.cos(φ2)*
Math.sin(Δλ/2)*Math.sin(Δλ/2);

const c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}

/* SMS position */

function sendLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(pos){

const lat = pos.coords.latitude;
const lon = pos.coords.longitude;

const mapUrl =
"https://maps.google.com/?q="+lat+","+lon;

const msg =
"Bonjour, j'ai trouvé Lola ici : "+mapUrl;

window.location.href =
"sms:+33672714336?body="+encodeURIComponent(msg);

});

}

}

/* icones */

function makeEmojiIcon(emoji,size){

return L.divIcon({

html:
"<div style='"+
"font-size:"+size+"px;"+
"line-height:"+size+"px;"+
"width:"+size+"px;"+
"height:"+size+"px;"+
"text-align:center;"+
"'>"+emoji+"</div>",

className:"",
iconSize:[size,size],
iconAnchor:[size/2,size/2]

});

}

function computeIconSize(zoom){

const size=Math.round(zoom*3.2);

return Math.max(22,Math.min(size,56));

}

/* carte */

function showMap(){

if(!navigator.geolocation){return;}

navigator.geolocation.getCurrentPosition(function(pos){

const lat=pos.coords.latitude;
const lon=pos.coords.longitude;

if(mapInstance){
mapInstance.remove();
mapInstance=null;
}

const map=L.map('map');
mapInstance=map;

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);

/* markers */

const catMarker=L.marker([lat,lon]).addTo(map);
const homeMarker=L.marker([homeLat,homeLon]).addTo(map);

/* ligne */

const line=L.polyline(
[
[lat,lon],
[homeLat,homeLon]
],
{color:"orange"}
).addTo(map);

/* distance */

const d=distance(lat,lon,homeLat,homeLon);

let texte;

if(d<1000){
texte=Math.round(d)+" m";
}else{
texte=(d/1000).toFixed(2)+" km";
}

const distanceMarker=L.marker(
[(lat+homeLat)/2,(lon+homeLon)/2],
{
icon:L.divIcon({
html:
"<div style='color:#ff3b3b;font-weight:bold;font-size:20px;text-shadow:0 0 5px black;'>"+texte+"</div>",
className:""
})
}
).addTo(map);

/* popups */

catMarker.bindPopup("🐾 Chat trouvé ici<br>"+texte+" de la maison");

homeMarker.bindPopup("🏠 Maison : 6 route du Sagard");

/* resize icones */

function resizeIcons(){

const zoom=map.getZoom();
const size=computeIconSize(zoom);

catMarker.setIcon(makeEmojiIcon("🐾",size));
homeMarker.setIcon(makeEmojiIcon("🏠",size));

}

/* cadrage */

const group=new L.featureGroup([catMarker,homeMarker,line,distanceMarker]);

map.fitBounds(group.getBounds(),{padding:[40,40]});

map.whenReady(function(){
setTimeout(function(){resizeIcons();},50);
});

map.on("zoomend",function(){resizeIcons();});

});

}

</script>

</body>
</html>
