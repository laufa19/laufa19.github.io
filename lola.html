<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🐾 Lola Fayet</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<script
src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

body{
background:#111;
font-family:Arial;
color:#eee;
text-align:center;
margin:0;
padding:25px;
}

.card{
background:#1b1b1b;
max-width:420px;
margin:auto;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

img{
width:100%;
max-width:260px;
border-radius:18px;
margin-bottom:15px;
}

h1{
margin:10px 0;
}

.button{
display:block;
width:100%;
padding:16px;
margin:12px 0;
border-radius:12px;
font-size:19px;
font-weight:bold;
text-decoration:none;
color:white;
border:none;
box-sizing:border-box;
cursor:pointer;
}

.call{background:#e84141;}
.sms{background:#00a884;}
.loc{background:#2e86ff;}
.map{background:#7a5cff;}

#map{
height:320px;
width:100%;
margin-top:15px;
border-radius:15px;
}

.info{
margin-top:16px;
font-size:17px;
color:#ccc;
}

a{color:#7fb3ff;}

</style>

</head>

<body>

<div class="card">

<img src="lola.png">

<h1>🐾 Lola Fayet</h1>

<a class="button call" href="tel:+33672714336">
📞 Appeler ma famille
</a>

<a class="button sms" href="sms:+33672714336">
💬 Envoyer un SMS
</a>

<button class="button loc" onclick="sendLocation()">
📍 Envoyer ma position
</button>

<button class="button map" onclick="showMap()">
🗺 Voir la carte
</button>

<div id="map"></div>

<div class="info">
6 route du Sagard<br>
19200 Ussel
</div>

<div class="info">
✉️
<a href="mailto:laurent.fayet.email@gmail.com">
laurent.fayet.email@gmail.com
</a>
</div>

<div class="info">
<strong>Tatouage :</strong> 177XZV
</div>

</div>


<script>

/* coordonnées maison */

let homeLat = 45.536151;
let homeLon = 2.298581;


/* distance Haversine */

function distance(lat1, lon1, lat2, lon2){

let R = 6371000;

let φ1 = lat1*Math.PI/180;
let φ2 = lat2*Math.PI/180;

let Δφ = (lat2-lat1)*Math.PI/180;
let Δλ = (lon2-lon1)*Math.PI/180;

let a =
Math.sin(Δφ/2)*Math.sin(Δφ/2)+
Math.cos(φ1)*Math.cos(φ2)*
Math.sin(Δλ/2)*Math.sin(Δλ/2);

let c = 2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));

return R*c;

}


/* envoyer SMS avec position */

function sendLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(pos){

let lat = pos.coords.latitude;
let lon = pos.coords.longitude;

let map =
"https://maps.google.com/?q="+lat+","+lon;

let msg =
"Bonjour, j'ai trouvé Lola ici : "+map;

window.location.href =
"sms:+33672714336?body="+encodeURIComponent(msg);

});

}

}


/* afficher carte */

function showMap(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(pos){

let lat = pos.coords.latitude;
let lon = pos.coords.longitude;

let map = L.map('map');

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);


/* icônes */

let catIcon = L.divIcon({
html:"🐾",
iconSize:[30,30],
className:""
});

let homeIcon = L.divIcon({
html:"🏠",
iconSize:[30,30],
className:""
});


/* markers */

let catMarker =
L.marker([lat,lon],{icon:catIcon}).addTo(map);

let homeMarker =
L.marker([homeLat,homeLon],{icon:homeIcon}).addTo(map);


/* ligne */

L.polyline(
[
[lat,lon],
[homeLat,homeLon]
],
{color:"orange"}
).addTo(map);


/* distance */

let d = distance(lat,lon,homeLat,homeLon);

let texte;

if(d < 1000){

texte = Math.round(d)+" m";

}else{

texte = (d/1000).toFixed(2)+" km";

}

catMarker.bindPopup("🐾 Chat trouvé ici<br>"+texte+" de la maison");

/* afficher distance sur la carte */

L.marker(
[(lat+homeLat)/2,(lon+homeLon)/2],
{
icon: L.divIcon({
html:"<div style='color:white;background:#000;padding:4px 8px;border-radius:6px;font-size:14px;'>"+texte+"</div>",
className:""
})
}
).addTo(map);


/* cadrer carte pour voir les deux */

let group = new L.featureGroup([catMarker,homeMarker]);

map.fitBounds(group.getBounds(),{padding:[50,50]});

});

}

}

</script>

</body>
</html>
