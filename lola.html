<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🐾 Lola Fayet</title>

<style>

body{

background:#f4f6f8;
text-align:center;
margin:0;
padding:20px;
}

.card{
background:white;
max-width:420px;
margin:auto;
padding:25px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,0.15);
}

img{
width:220px;
border-radius:50%;
margin-bottom:15px;
border:5px solid #eee;
}

h1{
margin:10px 0;
}

.alert{
color:#d40000;
font-size:20px;
font-weight:bold;
margin:15px 0;
}

button,a.button{

display:block;
width:100%;
padding:16px;

font-weight:bold;

border:none;
border-radius:12px;

text-decoration:none;

color:white;

}

.call{
background:#ff4d4d;
}

.sms{
background:#00b894;
}

.loc{
background:#0984e3;
}

.map{
background:#6c5ce7;
}

.info{
margin-top:15px;
font-size:17px;
}

</style>

</head>


<body>

<div class="card">

<img src="lola.png">

<h1>🐾 Lola Fayet</h1>

<div class="alert">
⚠️ J'ai probablement une famille qui me cherche
</div>

<a class="button call" href="tel:+33672714336">
📞 Appeler immédiatement
</a>

<a class="button sms" href="sms:+33672714336">
💬 Envoyer un SMS
</a>

<button class="loc" onclick="sendLocation()">
📍 Envoyer ma position
</button>

<button class="map" onclick="openMap()">
🗺 Voir ma position sur carte
</button>

6 route du Sagard<br>
19200 Ussel

<div class="info">

laurent.fayet.email@gmail.com
</a>

</div>

<div class="info">

<strong>Tatouage :</strong> 177XZV

</div>

</div>


<script>

function sendLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(pos){

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

let map="https://www.google.com/maps?q="+lat+","+lon;

window.location.href=
"sms:+33672714336?body=J'ai trouvé Lola ici : "+map;

});

}

else{

alert("La géolocalisation n'est pas disponible");

}

}


function openMap(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(pos){

let lat=pos.coords.latitude;
let lon=pos.coords.longitude;

window.open("https://www.google.com/maps?q="+lat+","+lon);

});

}

}

</script>

</body>
