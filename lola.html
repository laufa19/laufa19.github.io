<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🐾 Lola Fayet</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<script
src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>

body{
background:#111;
font-family:Arial;
color:#eee;
text-align:center;
margin:0;
padding:25px;
}

.card{
background:#1b1b1b;
max-width:420px;
margin:auto;
padding:25px;
border-radius:20px;
box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

img{
width:100%;
max-width:260px;
border-radius:18px;
margin-bottom:15px;
}

h1{
margin:10px 0;
}

.alert{
color:#ff5a5a;
font-size:20px;
font-weight:bold;
margin:15px 0;
}

.button{
display:block;
width:100%;
padding:16px;
margin:12px 0;
border-radius:12px;
font-size:19px;
font-weight:bold;
text-decoration:none;
color:white;
border:none;
box-sizing:border-box;
cursor:pointer;
}

.call{background:#e84141;}
.sms{background:#00a884;}
.loc{background:#2e86ff;}
.map{background:#7a5cff;}

#map{
height:320px;
width:100%;
margin-top:15px;
border-radius:15px;
}

.info{
margin-top:16px;
font-size:17px;
color:#ccc;
}

a{color:#7fb3ff;}

</style>

</head>

<body>

<div class="card">

<img src="lola.png">

<h1>🐾 Lola Fayet</h1>

<div class="alert">
⚠️ Si vous me trouvez ma famille me cherche
</div>

<a class="button call" href="tel:+33672714336">
📞 Appeler ma famille
</a>

<a class="button sms" href="sms:+33672714336">
💬 Envoyer un SMS
</a>

<button class="button loc" onclick="sendLocation()">
📍 Envoyer ma position
</button>

<button class="button map" onclick="showMap()">
🗺 Voir la carte
</button>

<div id="map"></div>

<div class="info">
6 route du Sagard<br>
19200 Ussel
</div>

<div class="info">
✉️
<a href="mailto:laurent.fayet.email@gmail.com">
laurent.fayet.email@gmail.com
</a>
</div>

<div class="info">
<strong>Tatouage :</strong> 177XZV
</div>

</div>


<script>

/* coordonnées maison */

let homeLat = 45.536151;
let homeLon = 2.298581;


/* envoyer SMS avec position */

function sendLocation(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(pos){

let lat = pos.coords.latitude;
let lon = pos.coords.longitude;

let map =
"https://maps.google.com/?q="+lat+","+lon;

let msg =
"Bonjour, j'ai trouvé Lola ici : "+map;

window.location.href =
"sms:+33672714336?body="+encodeURIComponent(msg);

});

}

}


/* afficher carte IGN */

function showMap(){

if(navigator.geolocation){

navigator.geolocation.getCurrentPosition(function(pos){

let lat = pos.coords.latitude;
let lon = pos.coords.longitude;

/* créer carte */

let map = L.map('map').setView([lat,lon],15);

/* fond IGN */

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:19,
attribution:'© OpenStreetMap'
}
).addTo(map);


/* icône chat */

let catIcon = L.divIcon({
html:"🐾",
iconSize:[30,30],
className:""
});

/* icône maison */

let homeIcon = L.divIcon({
html:"🏠",
iconSize:[30,30],
className:""
});


/* marker chat */

L.marker([lat,lon],{icon:catIcon})
.addTo(map)
.bindPopup("🐾 Chat trouvé ici");


/* marker maison */

L.marker([homeLat,homeLon],{icon:homeIcon})
.addTo(map)
.bindPopup("🏠 Maison : 6 route du Sagard");


/* ligne entre les deux */

L.polyline(
[
[lat,lon],
[homeLat,homeLon]
],
{color:"orange"}
).addTo(map);

});

}

}

</script>

</body>
</html>
