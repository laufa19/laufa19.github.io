<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>🐾 Lilou FAYET</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css"/>

<script
src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js">
</script>

<style>
body{
  background:#111;
  font-family:Arial, sans-serif;
  color:#eee;
  text-align:center;
  margin:0;
  padding:25px;
}

.card{
  background:#1b1b1b;
  max-width:420px;
  margin:auto;
  padding:25px;
  border-radius:20px;
  box-shadow:0 10px 30px rgba(0,0,0,0.6);
}

img{
  width:100%;
  max-width:260px;
  border-radius:18px;
  margin-bottom:15px;
}

h1{
  margin:10px 0;
}

.button{
  display:block;
  width:100%;
  padding:16px;
  margin:12px 0;
  border-radius:12px;
  font-size:19px;
  font-weight:bold;
  text-decoration:none;
  color:white;
  border:none;
  box-sizing:border-box;
  cursor:pointer;
}

.call{background:#e84141;}
.sms{background:#00a884;}
.loc{background:#2e86ff;}
.map{background:#7a5cff;}

#map{
  height:320px;
  width:100%;
  margin-top:15px;
  border-radius:15px;
}

.info{
  margin-top:16px;
  font-size:17px;
  color:#ccc;
}

a{
  color:#7fb3ff;
}
</style>
</head>

<body>

<div class="card">

  <img src="lilou.png" alt="Lilou">

  <h1>🐾 Lilou FAYET</h1>

  <a class="button call" href="tel:+33672714336">
    📞 Appeler ma famille
  </a>

  <a class="button sms" href="sms:+33672714336">
    💬 Envoyer un SMS
  </a>

  <button class="button loc" onclick="sendLocation()">
    📍 Envoyer ma position
  </button>

  <button class="button map" onclick="showMap()">
    🗺 Voir la carte
  </button>

  <div id="map"></div>

  <div class="info">
    6 route du Sagard<br>
    19200 Ussel
  </div>

  <div class="info">
    ✉️
    <a href="mailto:laurent.fayet.email@gmail.com">
      laurent.fayet.email@gmail.com
    </a>
  </div>

  <div class="info">
    <strong>Tatouage :</strong> 177XZF
  </div>

</div>

<script>
/* coordonnées maison */
const homeLat = 45.536151;
const homeLon = 2.298581;

let mapInstance = null;

/* distance Haversine */
function distance(lat1, lon1, lat2, lon2){
  const R = 6371000;

  const phi1 = lat1 * Math.PI / 180;
  const phi2 = lat2 * Math.PI / 180;
  const dPhi = (lat2 - lat1) * Math.PI / 180;
  const dLambda = (lon2 - lon1) * Math.PI / 180;

  const a =
    Math.sin(dPhi/2) * Math.sin(dPhi/2) +
    Math.cos(phi1) * Math.cos(phi2) *
    Math.sin(dLambda/2) * Math.sin(dLambda/2);

  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

  return R * c;
}

/* envoyer SMS avec position */
function sendLocation(){
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(function(pos){
      const lat = pos.coords.latitude;
      const lon = pos.coords.longitude;

      const mapUrl = "https://maps.google.com/?q=" + lat + "," + lon;
      const msg = "Bonjour, j'ai trouvé Lilou ici : " + mapUrl;

      window.location.href =
        "sms:+33672714336?body=" + encodeURIComponent(msg);
    });
  }
}

/* taille dynamique des icônes selon zoom */
function makeEmojiIcon(emoji, size){
  return L.divIcon({
    html:
      "<div style='" +
      "font-size:" + size + "px;" +
      "line-height:" + size + "px;" +
      "width:" + size + "px;" +
      "height:" + size + "px;" +
      "text-align:center;" +
      "'>" + emoji + "</div>",
    className: "",
    iconSize: [size, size],
    iconAnchor: [size / 2, size / 2]
  });
}

function computeIconSize(zoom){
  /* Ajuste ici si tu veux plus grand ou plus petit */
  const size = Math.round(zoom * 3.2);

  /* borne mini / maxi pour rester propre */
  return Math.max(22, Math.min(size, 56));
}

/* afficher carte */
function showMap(){
  if(!navigator.geolocation){
    return;
  }

  navigator.geolocation.getCurrentPosition(function(pos){
    const lat = pos.coords.latitude;
    const lon = pos.coords.longitude;

    if(mapInstance){
      mapInstance.remove();
      mapInstance = null;
    }

    const map = L.map('map');
    mapInstance = map;

    L.tileLayer(
      'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
      {
        maxZoom: 19,
        attribution: '© OpenStreetMap'
      }
    ).addTo(map);

    const catMarker = L.marker([lat, lon]).addTo(map);
    const homeMarker = L.marker([homeLat, homeLon]).addTo(map);

    const line = L.polyline(
      [
        [lat, lon],
        [homeLat, homeLon]
      ],
      {color:"orange"}
    ).addTo(map);

    const d = distance(lat, lon, homeLat, homeLon);

    let texte;
    if(d < 1000){
      texte = Math.round(d) + " m";
    }else{
      texte = (d / 1000).toFixed(2) + " km";
    }

/* position milieu */

let midLat = (lat + homeLat) / 2;
let midLon = (lon + homeLon) / 2;

/* vecteur direction */

let dx = homeLon - lon;
let dy = homeLat - lat;

/* longueur */

let len = Math.sqrt(dx*dx + dy*dy);

/* vecteur perpendiculaire */

let offsetLat = midLat + (-dx/len) * 0.002;
let offsetLon = midLon + (dy/len) * 0.002;

/* marker distance */

const distanceMarker = L.marker(
[offsetLat, offsetLon],
{
icon: L.divIcon({
html:
"<div style='color:white;background:#000;padding:6px 12px;border-radius:8px;font-size:18px;white-space:nowrap;'>"+texte+"</div>",
iconSize:[90,30],
iconAnchor:[45,15],
className:""
})
}
).addTo(map);

    catMarker.bindPopup("🐾 Chat trouvé ici<br>" + texte + " de la maison");
    homeMarker.bindPopup("🏠 Maison : 6 route du Sagard");

    function resizeIcons(){
      const zoom = map.getZoom();
      const size = computeIconSize(zoom);

      catMarker.setIcon(makeEmojiIcon("🐾", size));
      homeMarker.setIcon(makeEmojiIcon("🏠", size));
    }

    const group = new L.featureGroup([catMarker, homeMarker, line]);
    map.fitBounds(group.getBounds(), {padding:[40,40]});

    /* Important : attendre que le zoom final soit posé */
    map.whenReady(function(){
      setTimeout(function(){
        resizeIcons();
      }, 50);
    });

    map.on("zoomend", function(){
      resizeIcons();
    });
  });
}
</script>

</body>
</html>
